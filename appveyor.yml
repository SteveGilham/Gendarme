version: 1.0.{build}
pull_requests:
  do_not_increment_build_number: true
branches:
  except:
  - trunk
  - /develop.*/
skip_tags: true
image: Visual Studio 2022
configuration: Release
clone_depth: 2
environment:
  COVERALLS_REPO_TOKEN:
    secure: qgIIfE76i59qTVO64mT7QwKcAUUYCQLie4XdUdlnt7MXLhrwqTbcfGUsCss/TmLg
nuget:
  disable_publish_on_pr: true
install:
  - cinst dotnet-sdk --version 6.0.202
build_script:
- ps: >-
    $ErrorActionPreference = 'Continue'

    & dotnet tool restore

    & dotnet fake run .\Build\setup.fsx

    & dotnet fake run .\Build\build.fsx --target OperationalTest

    $save = $LASTEXITCODE
    
    $error.Clear()

    Write-Host "Exit code $save"

    if ($save -ne 0) { exit $save }
test: off
artifacts:
- path: .\_Packaging\*.nupkg
  name: Nuget
deploy:
- provider: NuGet
  api_key:
    secure: IAJhZUJ7+G2nmClLCyNKBtAt97YHrfgaUqCexj0VwWOJsXC6FkRrXDlcC4di5SV5
  on:
    branch: /release.*/
notifications:
- provider: Slack
  incoming_webhook: 
    secure: yzKiNN5snmI7Vzh12NWUEKC+V/w5wGI1ZMUGPT8p5WRefjAbB6DSgYkmWnzNADq9SurhbgIE2hlcCQivCQJ5gQE3AEGFpe+V7Dh/Up/jV0U=
  on_build_success: true
  on_build_failure: true
  on_build_status_changed: false  